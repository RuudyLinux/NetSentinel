version 17.6
service timestamps debug datetime msec
service timestamps log datetime msec
boot-start-marker
!
hostname core-sw-01
!
enable secret 9 $9$k3vNq7$FbP2xQ8mZ1tR6yV4nL0hJ9sD3wA5cE7gK
!
aaa new-model
!
security passwords min-length 12
!
username netops privilege 15 secret 9 $9$m2XeQ0$dR7pL4kS9vB1nT6yH3wF8jC5xM0aZq
!
ip ssh version 2
no ip http server
ip http secure-server
!
logging buffered 16384
logging host 10.0.0.10
!
ntp server 10.0.0.5
!
snmp-server group NETMON v3 priv
!
banner login ^C Authorized access only. All activity is monitored and logged. ^C
!
interface GigabitEthernet0/0
 description Uplink to core
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
ip access-list standard MGMT-ACL
 permit 10.0.0.0 0.0.0.255
!
line vty 0 4
 transport input ssh
 exec-timeout 5 0
 access-class MGMT-ACL in
line con 0
 exec-timeout 5 0
!
end
