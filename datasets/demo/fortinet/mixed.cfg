#config-version=FGT60F-7.2.5-FW-build1517-230510:opmode=0:vdom=0:user=admin
config system global
    set hostname "branch-fw-07"
    set admintimeout 15
    set pre-login-banner enable
    set some-future-fortios-setting enable
end
config system interface
    edit "port1"
        set mode static
        set ip 10.0.1.1 255.255.255.0
        set allowaccess ping https ssh
    next
end
config system admin
    edit "netops"
        set accprofile "super_admin"
        set another-unrecognized-admin-setting disable
    next
end
config log disk setting
    set status enable
end
config system ntp
    set ntpsync enable
end
config firewall policy
    edit 1
        set srcintf "port1"
        set dstintf "port2"
        set action accept
    next
end
