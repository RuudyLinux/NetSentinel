# SP6 target stack (Postgres/Redis/MinIO/Celery), committed and kept accurate from day
# one per docs/architecture.md's seam table. This is NOT the slice-1 development path —
# for local development, run the backend and frontend directly (see README.md). The
# three seams (DATABASE_URL, StorageBackend, TaskRunner) are what let this compose file
# become the real deployment target later without touching application code.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: netsentinel
      POSTGRES_PASSWORD: netsentinel-dev-only
      POSTGRES_DB: netsentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: netsentinel
      MINIO_ROOT_PASSWORD: netsentinel-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    environment:
      NETSENTINEL_DATABASE_URL: postgresql+psycopg://netsentinel:netsentinel-dev-only@postgres:5432/netsentinel
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  # frontend: a Dockerfile for the frontend arrives with SP6 alongside the rest of the
  # containerized stack; slice 1 runs it directly via `npm run dev` (see README.md).

volumes:
  postgres_data:
  minio_data:
