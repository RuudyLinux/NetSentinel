REM-SSH-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Enable SSH management access
  cli: |
    configure terminal
     ip domain-name example.com
     crypto key generate rsa modulus 2048
     ip ssh version 2
     line vty 0 15
      transport input ssh
     exit
    end
    write memory
  verification: "show ip ssh"
  rollback: |
    configure terminal
     line vty 0 15
      transport input none
     exit
     no crypto key generate rsa
    end
  notes: "Generating the RSA key pair enables the SSH server; confirm a management VRF or ACL restricts access before opening vty lines."

REM-HTTP-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Disable the HTTP management server
  cli: |
    configure terminal
     no ip http server
    end
    write memory
  verification: "show ip http server status"
  rollback: |
    configure terminal
     ip http server
    end
  notes: "Confirm no automation depends on the cleartext HTTP API before disabling it."

REM-HTTPS-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Enable the HTTPS management server
  cli: |
    configure terminal
     ip http secure-server
     no ip http server
    end
    write memory
  verification: "show ip http server status"
  rollback: |
    configure terminal
     no ip http secure-server
    end
  notes: "Requires an RSA key pair to already exist; the device will generate one if missing when this command runs."

REM-SESSION-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Enforce idle session timeout on management lines
  cli: |
    configure terminal
     line vty 0 15
      exec-timeout 10 0
     exit
     line con 0
      exec-timeout 10 0
     exit
    end
    write memory
  verification: "show running-config | section line vty"
  rollback: |
    configure terminal
     line vty 0 15
      exec-timeout 0 0
     exit
    end
  notes: "10 minutes (600 seconds) satisfies the CIS benchmark ceiling; tighten further per local policy."

REM-MGMTACL-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Restrict management lines with an access list
  cli: |
    configure terminal
     ip access-list standard MGMT-ACCESS
      permit 10.0.0.0 0.0.0.255
      deny any log
     exit
     line vty 0 15
      access-class MGMT-ACCESS in
     exit
    end
    write memory
  verification: "show ip access-lists MGMT-ACCESS"
  rollback: |
    configure terminal
     line vty 0 15
      no access-class MGMT-ACCESS in
     exit
     no ip access-list standard MGMT-ACCESS
    end
  notes: "Replace 10.0.0.0/24 with the organization's actual management subnet before applying."

REM-PASSLEN-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Enforce minimum local password length
  cli: |
    configure terminal
     security passwords min-length 8
    end
    write memory
  verification: "show running-config | include security passwords"
  rollback: |
    configure terminal
     no security passwords min-length
    end
  notes: "This policy applies only to passwords set after the command runs; existing weak passwords must be rotated separately."

REM-AAA-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Enable centralized AAA authentication
  cli: |
    configure terminal
     aaa new-model
     aaa authentication login default group tacacs+ local
     aaa authorization exec default group tacacs+ local
    end
    write memory
  verification: "show running-config | include aaa"
  rollback: |
    configure terminal
     no aaa new-model
    end
  notes: "Ensure a working local fallback account and reachable TACACS+/RADIUS server are confirmed before enabling aaa new-model, or you can lock yourself out of the device."

REM-ENABLE-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Set a strong, hashed enable secret
  cli: |
    configure terminal
     enable algorithm-type scrypt secret "ReplaceWithAStrongPassphrase123!"
     no enable password
    end
    write memory
  verification: "show running-config | include enable secret"
  rollback: |
    configure terminal
     no enable secret
    end
  notes: "Never leave this literal placeholder passphrase in production configuration; generate and store a unique secret per device in the credential vault."

REM-DEFACCT-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Remove default vendor accounts
  cli: |
    configure terminal
     no username cisco
     no username admin
    end
    write memory
  verification: "show running-config | include username"
  rollback: |
    configure terminal
     username cisco privilege 15 secret "TemporaryRestoreOnly123!"
    end
  notes: "Confirm a properly provisioned named administrative account exists and has been tested before removing default accounts."

REM-LOGLOCAL-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Enable the local logging buffer
  cli: |
    configure terminal
     logging buffered 65536 informational
    end
    write memory
  verification: "show logging"
  rollback: |
    configure terminal
     no logging buffered
    end
  notes: "Buffer size may need tuning on lower-memory platforms."

REM-NTP-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Configure NTP time synchronization
  cli: |
    configure terminal
     ntp server 10.0.0.20
     ntp server 10.0.0.21
     clock timezone UTC 0
    end
    write memory
  verification: "show ntp status"
  rollback: |
    configure terminal
     no ntp server 10.0.0.20
     no ntp server 10.0.0.21
    end
  notes: "Replace 10.0.0.20/21 with the organization's authoritative time sources; consider NTP authentication where supported."

REM-SNMP-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Migrate SNMP access to SNMPv3 only
  cli: |
    configure terminal
     no snmp-server community public
     no snmp-server community private
     snmp-server group NETSENTINEL-GROUP v3 priv
     snmp-server user netsentinel NETSENTINEL-GROUP v3 auth sha "ReplaceWithAuthKey123!" priv aes 128 "ReplaceWithPrivKey123!"
    end
    write memory
  verification: "show snmp user"
  rollback: |
    configure terminal
     no snmp-server user netsentinel NETSENTINEL-GROUP v3
     no snmp-server group NETSENTINEL-GROUP v3 priv
    end
  notes: "Never leave the literal placeholder auth/priv keys in production configuration; generate unique keys and remove any legacy v1/v2c community strings."

REM-BANNER-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Configure a login legal notice banner
  cli: |
    configure terminal
     banner login ^
     Unauthorized access to this device is prohibited. All activity is logged
     and monitored. Disconnect immediately if you are not an authorized user.
     ^
    end
    write memory
  verification: "show running-config | section banner login"
  rollback: |
    configure terminal
     no banner login
    end
  notes: "Have legal/compliance review the exact banner wording for the organization's jurisdiction."

REM-SSH-002:
  vendor: cisco
  os: [ios, ios-xe]
  title: Enforce SSH version 2
  cli: |
    configure terminal
     ip ssh version 2
    end
    write memory
  verification: "show ip ssh"
  rollback: |
    configure terminal
     ip ssh version 1
    end
  notes: "Confirm all management clients support SSHv2 before applying."

REM-TELNET-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Remove Telnet from management lines
  cli: |
    configure terminal
     line vty 0 15
      transport input ssh
     exit
    end
    write memory
  verification: "show running-config | section line vty"
  rollback: |
    configure terminal
     line vty 0 15
      transport input ssh telnet
     exit
    end
  notes: "Verify SSH connectivity from the management network before removing Telnet."

REM-LOGREMOTE-001:
  vendor: cisco
  os: [ios, ios-xe]
  title: Configure a remote syslog destination
  cli: |
    configure terminal
     logging host 10.0.0.10
     logging trap informational
     logging source-interface Loopback0
    end
    write memory
  verification: "show logging"
  rollback: |
    configure terminal
     no logging host 10.0.0.10
    end
  notes: "Replace 10.0.0.10 with the organization's syslog collector."
