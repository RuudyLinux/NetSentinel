  expected: true
  severity: MEDIUM
  evidence_required: true
  remediation_id: REM-NTP-001
  source: "NIST SP 800-53 Rev. 5 - AU-8 Time Stamps"
  tests:
    - {given: true, expect: PASS}
    - {given: false, expect: FAIL}
    - {given: null, expect: NOT_ASSESSABLE}

- id: NIST-SC8-SNMP-001
  framework: NIST
  framework_version: "800-53r5"
  title: Network management protocol traffic is cryptographically protected
  description: >
    SNMP v1 and v2c carry community strings in cleartext with no integrity
    protection; only SNMPv3 (which supports authentication and encryption)
    may be configured.
  impact: >
    SNMP community strings sent in cleartext can be captured and used to read
    or modify device configuration.
  applicability: {vendor: cisco, os: [ios, ios-xe]}
  parameter: snmp.v3.only
  operator: equals
  expected: true
  severity: HIGH
  evidence_required: true
  remediation_id: REM-SNMP-001
  source: "NIST SP 800-53 Rev. 5 - SC-8 Transmission Confidentiality and Integrity"
  tests:
    - {given: true, expect: PASS}
    - {given: false, expect: FAIL}
    - {given: null, expect: NOT_ASSESSABLE}

- id: NIST-AC8-BANNER-001
  framework: NIST
  framework_version: "800-53r5"
  title: System use notification is displayed before logon
  description: >
    The device must display an approved system use notification banner before
    granting access.
  impact: >
    Without a posted legal notice, unauthorized access may be harder to
